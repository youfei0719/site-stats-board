<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站数据看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">网站数据看板</div>
    <nav class="nav" id="nav">
      <button data-view="overview" class="active">总览</button>
      <button data-view="traffic">流量分析</button>
      <button data-view="source">来源分析</button>
      <button data-view="pages">页面分析</button>
      <button data-view="visitors">访客分析</button>
      <button data-view="realtime">实时访客</button>
    </nav>
    <div class="side-foot">数据更新于 <span id="updated-at">—</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="controls">
        <div class="segmented" id="site-seg" role="tablist" aria-label="站点"></div>
        <div class="segmented" id="range-seg" role="tablist" aria-label="时间范围">
          <button data-range="today" class="active">今日</button>
          <button data-range="yesterday">昨日</button>
          <button data-range="7d">近 7 天</button>
          <button data-range="30d">近 30 天</button>
        </div>
      </div>
      <button id="logout-btn" style="border:0;background:transparent;color:#737373;font-size:13px;cursor:pointer;padding:8px 4px;" onmouseover="this.style.color='#0a0a0a'" onmouseout="this.style.color='#737373'">退出</button>
    </header>

    <!-- 总览：Plausible 节奏 —— KPI 条 → 大趋势图（指标切换）→ 明细双表 → 实时条 -->
    <section class="view" id="view-overview">
      <div class="kpis kpis-4" id="kpis"></div>
      <div class="card">
        <div class="card-head">
          <div class="card-title">访问趋势</div>
          <div class="chart-tools">
            <div class="tabs" id="ov-metric-tabs">
              <button data-m="visitors" class="active">访客数</button>
              <button data-m="pageviews">浏览量</button>
              <button data-m="visits">访问次数</button>
            </div>
            <button class="toggle" id="ov-compare">对比上期</button>
          </div>
        </div>
        <div class="chart" id="ov-trend"></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">来源 Top5</div>
          <div id="ov-sources"></div>
        </div>
        <div class="card">
          <div class="card-title">热门页面 Top5</div>
          <div id="ov-pages"></div>
        </div>
      </div>
      <div class="card">
        <div class="realtime">
          <span class="live-dot"></span>
          <div>
            <span class="realtime-value" id="rt-strip">—</span>
            <div class="realtime-label">当前在线访客</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 流量分析：GA4 式 —— 指标选择器＋上期虚线对比＋24 小时分布 -->
    <section class="view hidden" id="view-traffic">
      <div class="card">
        <div class="card-head">
          <div class="card-title">流量趋势</div>
          <div class="chart-tools">
            <div class="tabs" id="tf-metric-tabs">
              <button data-m="visitors" class="active">访客数</button>
              <button data-m="pageviews">浏览量</button>
              <button data-m="visits">访问次数</button>
            </div>
            <button class="toggle" id="tf-compare">对比上期</button>
          </div>
        </div>
        <div class="chart" id="tf-chart"></div>
      </div>
      <div class="card">
        <div class="card-title">24 小时分布</div>
        <div class="chart chart-sm" id="hourly-chart"></div>
      </div>
    </section>

    <!-- 来源分析：产品逻辑——先看构成（图），再看明细（表），最后看下钻（域名/引擎） -->
    <section class="view hidden" id="view-source">
      <div class="card">
        <div class="card-title">渠道构成</div>
        <div class="chart chart-sm" id="channel-donut"></div>
      </div>
      <div class="card">
        <div class="card-title">渠道明细</div>
        <div id="channel-table"></div>
      </div>
      <div class="card">
        <div class="card-title">来源域名</div>
        <div id="domain-table"></div>
      </div>
      <div class="card">
        <div class="card-title">搜索引擎</div>
        <div id="engine-table"></div>
      </div>
    </section>

    <!-- 页面分析：百度受访页面列定义＋Mixpanel 克制条形 -->
    <section class="view hidden" id="view-pages">
      <div class="card">
        <div class="card-title">受访页面</div>
        <div id="pages-table"></div>
      </div>
    </section>

    <!-- 访客分析：Mixpanel Boards 式四宫格 -->
    <section class="view hidden" id="view-visitors">
      <div class="grid-2">
        <div class="card">
          <div class="card-title">国家 / 地区</div>
          <div id="v-country"></div>
        </div>
        <div class="card">
          <div class="card-title">浏览器</div>
          <div id="v-browser"></div>
        </div>
        <div class="card">
          <div class="card-title">操作系统</div>
          <div id="v-os"></div>
        </div>
        <div class="card">
          <div class="card-title">设备类型</div>
          <div id="v-device"></div>
        </div>
      </div>
    </section>

    <!-- 实时访客：GA4 实时卡片＋友盟实时呈现 -->
    <section class="view hidden" id="view-realtime">
      <div class="card">
        <div class="realtime">
          <span class="live-dot"></span>
          <div>
            <span class="realtime-value" id="rt-big">—</span>
            <div class="realtime-label">当前在线访客</div>
          </div>
        </div>
      </div>
      <div class="grid-3">
        <div class="card">
          <div class="card-title">实时页面</div>
          <div id="rt-urls"></div>
        </div>
        <div class="card">
          <div class="card-title">实时来源</div>
          <div id="rt-refs"></div>
        </div>
        <div class="card">
          <div class="card-title">实时国家</div>
          <div id="rt-countries"></div>
        </div>
      </div>
    </section>

  </main>
</div>
<script src="vendor/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
